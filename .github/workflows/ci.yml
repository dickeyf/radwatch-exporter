name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Test
        run: go test -race ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build image (amd64, for the checks below)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: radwatch-exporter:ci
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run hardened and smoke test (IMPL-20)
        run: |
          docker run -d --name rw --read-only --user 65532:65532 --cap-drop ALL             --security-opt no-new-privileges -p 8080:8080 -p 9090:9090 radwatch-exporter:ci
          for i in $(seq 1 20); do curl -fsS localhost:8080/readyz && break; sleep 0.5; done
          test "$(curl -fsS 'localhost:8080/log2.asp?AID=1&GID=2&CPM=15&ACPM=13.2&uSV=0.075')" = "OK.ERR0"
          curl -fsS localhost:9090/metrics | grep -F 'radwatch_cpm{device="2",device_id="2",protocol="gmcmap"} 15'
          docker logs rw
      - name: Check image size and user
        run: |
          size=$(docker image inspect radwatch-exporter:ci --format '{{.Size}}')
          echo "image size: $((size / 1024 / 1024)) MiB"
          test "$size" -lt $((20 * 1024 * 1024))
          test "$(docker image inspect radwatch-exporter:ci --format '{{.Config.User}}')" = "65532:65532"
      - name: Scan image (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: radwatch-exporter:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Logs on failure
        if: failure()
        run: docker logs rw || true

  publish:
    # Push only from main (edge) and version tags (releases), never from PRs.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [lint-test, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/radwatch-exporter
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags (PD-08)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=edge,branch=main
      - name: Version
        id: version
        run: echo "value=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"
      - name: Build and push (amd64 + arm64, PD-04)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
