name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Test
        run: go test -race ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: radwatch-exporter:ci
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run hardened and smoke test (IMPL-20)
        run: |
          docker run -d --name rw --read-only --user 65532:65532 --cap-drop ALL \
            --security-opt no-new-privileges -p 8080:8080 -p 9090:9090 radwatch-exporter:ci
          for i in $(seq 1 20); do curl -fsS localhost:8080/readyz && break; sleep 0.5; done
          test "$(curl -fsS 'localhost:8080/log2.asp?AID=1&GID=2&CPM=15&ACPM=13.2&uSV=0.075')" = "OK.ERR0"
          curl -fsS localhost:9090/metrics | grep -F 'radwatch_cpm{device="2",device_id="2",protocol="gmcmap"} 15'
          docker logs rw
      - name: Check image size and user
        run: |
          size=$(docker image inspect radwatch-exporter:ci --format '{{.Size}}')
          echo "image size: $((size / 1024 / 1024)) MiB"
          test "$size" -lt $((20 * 1024 * 1024))
          test "$(docker image inspect radwatch-exporter:ci --format '{{.Config.User}}')" = "65532:65532"
      - name: Logs on failure
        if: failure()
        run: docker logs rw || true
