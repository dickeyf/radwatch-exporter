# Exercises every optional template and value in CI (IMPL-28). Placeholders only.
commonLabels: {team: home}
config:
  allowedCIDRs: ["192.168.1.50"]
  trustedProxies: ["10.0.0.0/8"]
  deviceNames: {"0034021": office}
  gmcmap:
    allowedGIDs: ["0034021"]
    forwardURL: http://www.gmcmap.com/log2.asp
  radmon:
    forwardURL: https://radmon.org/radmon.php
    user: station
    deviceID: "0034021"
    passwordSecret: {name: radmon, key: password}
podAnnotations: {example.com/note: ci}
podLabels: {tier: ci}
service:
  annotations: {example.com/note: ci}
  labels: {tier: ci}
ingestService:
  enabled: true
  loadBalancerIP: 10.10.10.20
  loadBalancerSourceRanges: ["192.168.1.50/32"]
  annotations: {lbipam.cilium.io/ips: 10.10.10.20}
  labels: {ipPool: private}
ingress:
  enabled: true
  className: traefik
  host: radwatch.example.com
  annotations:
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
  tls:
    enabled: true
    secretName: radwatch-tls
serviceMonitor:
  enabled: true
  interval: 30s
  labels: {release: prometheus}
grafanaDashboard:
  enabled: true
  annotations: {grafana_folder: Radiation}
networkPolicy:
  enabled: true
  ingestFrom:
    - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
      podSelector: {matchLabels: {app.kubernetes.io/name: traefik}}
  metricsFrom:
    - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}
  egress:
    - to: [{namespaceSelector: {}, podSelector: {matchLabels: {k8s-app: kube-dns}}}]
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
  annotations: {example.com/note: ci}
prometheusRule:
  enabled: true
  labels: {release: prometheus}
