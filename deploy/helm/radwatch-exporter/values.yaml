# Default values for radwatch-exporter. See docs/plan/05-helm-chart.md.

image:
  repository: ghcr.io/dickeyf/radwatch-exporter
  # Defaults to the chart's appVersion. Use a release (0.1.0) or a sha-<short> tag; there is no "latest".
  tag: ""
  # Optional digest (sha256:...); takes precedence over the tag when set.
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Added to every rendered resource.
commonLabels: {}

# Exporter configuration, rendered into a ConfigMap of RADWATCH_* env vars.
# Keys and defaults: README "Configuration". Empty lists mean "allow all".
config:
  logLevel: info
  staleAfter: 5m
  # Logs every raw ingest request with headers. Device debugging only.
  debugRequests: false
  # Source-IP allowlist, e.g. ["192.168.1.50"].
  allowedCIDRs: []
  # Addresses of the ingress controller pods, so X-Forwarded-For is trusted from them.
  trustedProxies: []
  # Friendly names: { "0034021": "office" }.
  deviceNames: {}
  gmcmap:
    path: /log2.asp
    allowedGIDs: []
    allowedAIDs: []
    responseStatus: 200
    responseBody: OK.ERR0
    # Re-send each accepted reading to a GMCmap server (PD-05, IMPL-34).
    # Empty: off. Public map: http://www.gmcmap.com/log2.asp
    forwardURL: ""
  # Forward readings to radmon.org or a compatible server (PD-05, IMPL-34).
  radmon:
    # Empty: off. Public map: https://radmon.org/radmon.php
    forwardURL: ""
    user: ""
    # Only this device's readings (a radmon account is one station); empty: all.
    deviceID: ""
    # The password comes from an existing Secret (never from values).
    passwordSecret:
      name: ""
      key: password

# Extra env vars for the container, as a list of EnvVar objects.
extraEnv: []

podAnnotations: {}
podLabels: {}

service:
  type: ClusterIP
  # Service port for ingest; the Ingress targets it. The container listens on 8080.
  port: 80
  metricsPort: 9090
  annotations: {}
  labels: {}

# Ingest-only Service with its own address, for counters configured by IP.
# The GMC-500+ does not resolve hostnames, so it cannot use the Ingress's host
# rule: give it a fixed LoadBalancer IP instead. Only the ingest port is exposed.
ingestService:
  enabled: false
  type: LoadBalancer
  port: 80
  # Local keeps the counter's source address, so config.allowedCIDRs works.
  externalTrafficPolicy: Local
  # Fixed address. Some implementations prefer an annotation instead
  # (Cilium LB-IPAM: lbipam.cilium.io/ips).
  loadBalancerIP: ""
  loadBalancerClass: ""
  # Optional extra filter at the load balancer, e.g. ["192.168.1.50/32"].
  loadBalancerSourceRanges: []
  # Free-form, e.g. an IP-pool selector label for Cilium.
  annotations: {}
  labels: {}

ingress:
  enabled: false
  # e.g. traefik
  className: ""
  # The device sends its Website setting as Host, so use the hostname configured on it.
  host: ""
  # Defaults to config.gmcmap.path.
  path: ""
  pathType: Exact
  # Free-form, passed through as-is (external-dns, Traefik router settings...).
  annotations: {}
  tls:
    # The device only speaks HTTP on port 80; keep HTTP routed even when TLS is on.
    enabled: false
    # Existing kubernetes.io/tls secret in the release namespace (e.g. from cert-manager).
    secretName: ""

# Prometheus Operator ServiceMonitor for the metrics port (AD-07). Needs the
# monitoring.coreos.com CRDs; Alloy's prometheus.operator.servicemonitors reads it too.
serviceMonitor:
  enabled: false
  # Empty uses the scraper's default.
  interval: ""
  scrapeTimeout: ""
  # Free-form; add whatever label your Prometheus/Alloy selects ServiceMonitors by.
  labels: {}
  annotations: {}
  relabelings: []
  metricRelabelings: []

# Alert rules as a Prometheus Operator PrometheusRule (IMPL-32, PD-07).
prometheusRule:
  enabled: false
  # Free-form; add whatever label your Prometheus selects rules by
  # (kube-prometheus-stack: release: <its release name>).
  labels: {}
  annotations: {}
  # Extra labels on every alert, for Alertmanager routing.
  alertLabels:
    service: radwatch
  # Device has not uploaded for this long (then "for" more before firing).
  deviceSilent:
    seconds: 600
    for: 2m
    severity: warning
  # Dose-rate thresholds in Sv/h (base units): 1e-6 = 1 µSv/h, about 10x a
  # typical background. Deliberate tests with sources will fire these: silence
  # them in Alertmanager.
  doseRate:
    warning:
      enabled: true
      sievertsPerHour: 1e-6
      for: 10m
    critical:
      enabled: true
      sievertsPerHour: 1e-5
      for: 5m

# Grafana dashboard as a ConfigMap for the Grafana sidecar (IMPL-31). The JSON
# is dashboards/radwatch.json in the chart.
grafanaDashboard:
  enabled: false
  # Empty: the release namespace. Set it if your sidecar only watches one namespace.
  namespace: ""
  # The label your Grafana sidecar selects on (kube-prometheus-stack default).
  labels:
    grafana_dashboard: "1"
  # e.g. grafana_folder: Radiation (sidecar folder annotation, if configured)
  annotations: {}

# NetworkPolicy for the exporter pod (IMPL-33, ADR-011). Needs a CNI that
# enforces NetworkPolicy (Cilium, Calico...). Kubelet probes come from the node;
# most CNIs allow them, check yours if the pod stops being ready.
networkPolicy:
  enabled: false
  # Ingest port: allow config.allowedCIDRs (a bare IP becomes /32 or /128).
  # Traffic through ingestService with externalTrafficPolicy: Local keeps the
  # counter's address, so this matches it.
  ingestFromAllowedCIDRs: true
  # Extra NetworkPolicyPeers for the ingest port, e.g. the ingress controller:
  # - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
  #   podSelector: {matchLabels: {app.kubernetes.io/name: traefik}}
  # With no CIDRs and no peers, the ingest port is open to all.
  ingestFrom: []
  # NetworkPolicyPeers allowed to scrape the metrics port, e.g.
  # - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}
  # Empty: any pod in the cluster (never outside it).
  metricsFrom: []
  # Egress rules. Empty denies all egress: the exporter makes no outbound calls
  # (forwarding, IMPL-34, will need DNS and the forward target here).
  egress: []
  annotations: {}

resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    memory: 64Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault

nodeSelector: {}
tolerations: []
affinity: {}
