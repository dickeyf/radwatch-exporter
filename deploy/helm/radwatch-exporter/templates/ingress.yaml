{{- if .Values.ingress.enabled -}}
{{- if not .Values.ingress.host }}
{{- fail "ingress.host is required when ingress.enabled is true (the device sends it as Host)" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "radwatch-exporter.fullname" . }}
  labels:
    {{- include "radwatch-exporter.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  {{- if not .Values.ingress.tls.secretName }}
  {{- fail "ingress.tls.secretName is required when ingress.tls.enabled is true" }}
  {{- end }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # Only the ingest path; /healthz, /readyz and the metrics port are never routed.
          - path: {{ include "radwatch-exporter.ingestPath" . }}
            pathType: {{ .Values.ingress.pathType }}
            backend:
              service:
                name: {{ include "radwatch-exporter.fullname" . }}
                port:
                  name: http
{{- end }}
