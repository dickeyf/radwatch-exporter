apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "radwatch-exporter.fullname" . }}
  labels:
    {{- include "radwatch-exporter.labels" . | nindent 4 }}
spec:
  # One replica only (ADR-003): readings live in memory, a second pod would split them.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "radwatch-exporter.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "radwatch-exporter.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      # The process finishes shutting down within 10 s of SIGTERM.
      terminationGracePeriodSeconds: 15
      {{- with .Values.config.radmon.passwordSecret }}
      {{- if .name }}
      volumes:
        # Optional Secret (IMPL-26): the radmon.org password, as a file (not an env var).
        - name: radmon-password
          secret:
            secretName: {{ .name }}
            items:
              - key: {{ .key }}
                path: password
      {{- end }}
      {{- end }}
      containers:
        - name: exporter
          image: {{ include "radwatch-exporter.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "radwatch-exporter.fullname" . }}
          {{- with .Values.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.config.radmon.passwordSecret.name }}
          volumeMounts:
            - name: radmon-password
              mountPath: /etc/radwatch/radmon
              readOnly: true
          {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
