# kube-linter policy for the rendered chart (IMPL-28): the default checks plus
# explicit security checks. The opinionated style checks (sorted keys, owner
# labels, DNS config...) are not enabled.
checks:
  include:
    - drop-net-raw-capability
    - no-read-only-root-fs
    - privilege-escalation-container
    - privileged-container
    - read-secret-from-env-var
    - run-as-non-root
    - unsafe-sysctls
    - writable-host-mount
    - host-network
    - host-pid
    - host-ipc
    - liveness-port
    - readiness-port
    - unset-memory-requirements
    - latest-tag
  exclude:
    # CPU limits are left off on purpose (throttling); memory is limited.
    - unset-cpu-requirements
    # The chart has no ServiceAccount; the pod mounts no token (automountServiceAccountToken: false).
    - default-service-account
    # Single replica by design (ADR-003).
    - no-anti-affinity
